name: validate
# Why this exists: no other workflow here runs on pull_request (ci.yml is
# workflow_call-only), so Renovate branches would carry ZERO checks — and
# Renovate (ignoreTests: false) never automerges a branch with no green
# signal. This job is that signal, and it validates the two things this repo
# actually is: digest-pinned workflows the whole fleet executes, and the org
# Renovate preset.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Every third-party action is digest-pinned
        # A mutable tag in THIS repo is a fleet-wide supply-chain hole: the
        # reusable ci.yml runs in every fleet repo's CI, and renovate.yml
        # mints a repo-write App token. Fail on any `uses:` not pinned to a
        # 40-hex commit (local `./` and same-repo reusable refs are exempt).
        run: |
          set -o pipefail
          bad=$(grep -rHnE '^\s*(- )?uses:' .github/workflows/ \
            | grep -vE 'uses:\s*(\./|reddoorla/)' \
            | grep -vE '@[0-9a-f]{40}( |$)' || true)
          if [ -n "$bad" ]; then
            echo "::error::unpinned action reference(s):"
            echo "$bad"
            exit 1
          fi
          echo "all third-party uses: are digest-pinned"
      - name: renovate-config.json parses and keeps its load-bearing keys
        # The whole fleet resolves this preset at Renovate runtime; a broken
        # JSON or a dropped platformAutomerge:false ships to every repo's
        # next cron tick.
        run: |
          node -e '
            const cfg = JSON.parse(require("fs").readFileSync("renovate-config.json", "utf8"));
            const rules = cfg.packageRules ?? [];
            const automergeRules = rules.filter((r) => r.automerge === true);
            if (automergeRules.length === 0) throw new Error("no automerge rules found — preset gutted?");
            for (const r of automergeRules) {
              if (r.platformAutomerge !== false) throw new Error("automerge rule without platformAutomerge:false (2026-07-26 incident class)");
            }
            if (cfg.lockFileMaintenance?.enabled && cfg.lockFileMaintenance.platformAutomerge !== false)
              throw new Error("lockFileMaintenance without platformAutomerge:false");
            // prCreation:not-pending waits for branch checks. Fleet CI runs on pull_request only, so a
            // Renovate branch has no check runs, and Renovate ignores its own renovate/* statuses unless
            // internalChecksAsSuccess is true. Without the pair, no routine PR was created anywhere in
            // the fleet from 2026-08-12 to 2026-09-21 (see the CORRECTION note in the preset).
            // status-success fails the same way: it also waits on a branch status that PR-only CI never turns green.
            // Limits, stated so nobody over-trusts this: it sees only this file, not a prCreation arriving from a nested
            // preset or from a site repo renovate.json; and it cannot see the per-repo required status check that is now
            // the only thing holding back an automerge before CI has run (reddoor-maintenance#892).
            if (["not-pending", "status-success"].includes(cfg.prCreation) && cfg.internalChecksAsSuccess !== true)
              throw new Error("prCreation:" + cfg.prCreation + " without internalChecksAsSuccess:true: no PR can ever open on PR-only CI (2026-08-12 freeze class)");
            // A lock-file branch carries no renovate/ status (minimumReleaseAge is null for it) and no check run, so it reads
            // pending forever under not-pending: a run that pushes it returns before PR creation, and a run that does not
            // sees it younger than prNotPendingHours (25) inside the Monday window. No lock-file PR opened fleet-wide from
            // 2026-09-15 to 2026-10-19 (reddoor-maintenance P1-52).
            if (["not-pending", "status-success"].includes(cfg.prCreation) && cfg.lockFileMaintenance?.enabled && cfg.lockFileMaintenance.prCreation !== "immediate")
              throw new Error("lockFileMaintenance without prCreation:immediate under prCreation:" + cfg.prCreation + ": no lock-file PR can open inside the Monday window (P1-52)");
            // A run that pushes a branch with no PR returns before PR creation unless prCreation is immediate, and the
            // grouped branch gets one in-window run a week, which nearly always pushes. 19 of 25 repos had no grouped PR
            // opened from 2026-09-22 to 2026-10-21 (reddoor-workspace decision 2026-10-21-2218).
            // Later rules win, so the LAST rule that sets prCreation for minor or patch decides, and it must be unscoped.
            const scoped = (r) => Object.keys(r).some((k) => k.startsWith("match") && k !== "matchUpdateTypes");
            const lastPrCreation = rules.filter((r) => "prCreation" in r && (r.matchUpdateTypes ?? []).some((t) => ["minor", "patch"].includes(t))).at(-1);
            const groupedImmediate = !!lastPrCreation && lastPrCreation.prCreation === "immediate" && !scoped(lastPrCreation) && ["minor", "patch"].every((t) => lastPrCreation.matchUpdateTypes.includes(t));
            if (["not-pending", "status-success"].includes(cfg.prCreation) && !groupedImmediate)
              throw new Error("no unscoped minor/patch rule with prCreation:immediate under prCreation:" + cfg.prCreation + ": the grouped PR cannot open on the run that pushes it (2026-10-21)");
            // Under group:allNonMajor one never-automerge package holds the whole grouped branch, so each hold needs a
            // minor/patch group of exactly its packages. A package held but left out of the group holds all-minor-patch again.
            const names = (r) => JSON.stringify([...r.matchPackageNames].sort());
            const minorPatch = JSON.stringify(["minor", "patch"]);
            for (const hold of rules.filter((r) => r.automerge === false && r.matchPackageNames && !r.matchUpdateTypes)) {
              if (!rules.some((g) => g.groupName && g.matchPackageNames && names(g) === names(hold) && JSON.stringify([...(g.matchUpdateTypes ?? [])].sort()) === minorPatch))
                throw new Error("never-automerge packages " + names(hold) + " have no minor/patch group of their own: they hold the whole all-minor-patch group (2026-10-21)");
            }
            // Majors hit the same early return: a run that pushes a new major branch opens no PR unless prCreation is
            // immediate, so a major opened only in a week when a second in-window run pushed nothing (reddoor-maintenance#1688).
            // An unscoped immediate rule must reach major, and no later rule may set any other prCreation for it (a later scoped
            // immediate rule is harmless; a later not-pending one, scoped or not, would undo it). Digests are left out on purpose:
            // they carry no release timestamp, so under minimumReleaseAge they are never branched, and made immediate they
            // open behind a stability status that never clears and take an hourly PR slot ahead of both grouped PRs
            // (reddoor-workspace decision 2026-10-24-1436).
            // matchUpdateTypes may be a string, and a rule without it reaches every update type.
            const reaches = (r, t) => (r.matchUpdateTypes == null ? [t] : [].concat(r.matchUpdateTypes)).includes(t);
            const majorRules = rules.filter((r) => "prCreation" in r && reaches(r, "major"));
            const firstMajorImmediate = majorRules.findIndex((r) => r.prCreation === "immediate" && !scoped(r));
            const majorImmediate = firstMajorImmediate !== -1 && majorRules.slice(firstMajorImmediate).every((r) => r.prCreation === "immediate");
            if (["not-pending", "status-success"].includes(cfg.prCreation) && !majorImmediate)
              throw new Error("no unscoped major rule with prCreation:immediate under prCreation:" + cfg.prCreation + ": a new major PR cannot open on the run that pushes it (#1688)");
            const digestImmediate = cfg.prCreation === "immediate" || cfg.digest?.prCreation === "immediate" ||
              rules.some((r) => r.prCreation === "immediate" && reaches(r, "digest"));
            if (digestImmediate)
              throw new Error("prCreation:immediate on digest: digests have no release timestamp, so the PR waits on a stability status that never clears and takes an hourly slot ahead of the grouped PRs (2026-10-24)");
            // Renovate sorts lock-file maintenance after every other update type and creates at most prHourlyLimit (2) PRs an
            // hour, so in a week when both grouped PRs refill it loses its slot to them (lib/workers/repository/process/sort.ts,
            // Renovate 44.176.1 to 44.181.3). prPriority sorts before update type, so lock-file maintenance needs the highest one, set by an
            // unscoped rule that matches lockFileMaintenance alone and is the last prPriority rule to reach it: a rule that also matched
            // minor or patch, or a later one with no matchUpdateTypes (say prPriority: -1), would tie the grouped branches with it, and
            // the update-type order would put them first again. Renovate accepts prPriority only inside packageRules.
            if (cfg.lockFileMaintenance?.enabled) {
              const lastLockPriority = rules.filter((r) => "prPriority" in r && reaches(r, "lockFileMaintenance")).at(-1);
              const others = rules.filter((r) => "prPriority" in r && r !== lastLockPriority).map((r) => r.prPriority);
              const higher = rules.filter((r) => "prPriority" in r && r !== lastLockPriority && !(lastLockPriority?.prPriority > r.prPriority));
              if (lastLockPriority && higher.length)
                throw new Error("prPriority " + JSON.stringify(higher.map((r) => r.prPriority)) + " on another packageRule is not below lock-file maintenance at " + lastLockPriority.prPriority + ": it would take the hourly PR slots first (#1688)");
              const lockOnly = !!lastLockPriority && JSON.stringify([].concat(lastLockPriority.matchUpdateTypes ?? [])) === JSON.stringify(["lockFileMaintenance"]);
              if (!lockOnly || scoped(lastLockPriority) || !(lastLockPriority.prPriority > Math.max(0, ...others)))
                throw new Error("lockFileMaintenance without an unscoped packageRule, matching it alone, that gives it the highest prPriority: the grouped PRs take the hourly PR slots first (#1688)");
            }
            console.log("renovate-config.json OK:", automergeRules.length, "automerge rule(s), platformAutomerge false everywhere");
          '
      - name: renovate-staging-flow.json parses, grants no automerge, and keeps its three base-bound rules
        run: |
          node -e '
            const cfg = JSON.parse(require("fs").readFileSync("renovate-staging-flow.json", "utf8"));
            const rules = cfg.packageRules ?? [];
            if (JSON.stringify(cfg.baseBranchPatterns) !== JSON.stringify(["main", "staging"]))
              throw new Error("baseBranchPatterns must be exactly [main, staging]");
            if (rules.some((r) => "automerge" in r || "platformAutomerge" in r))
              throw new Error("this preset must not set automerge: renovate-config owns it, with platformAutomerge:false");
            const all = ["major", "minor", "patch", "pin", "pinDigest", "digest", "lockFileMaintenance", "rollback", "bump", "replacement"];
            const off = (base) => new Set(rules.filter((r) => r.enabled === false && (r.matchBaseBranches ?? []).includes(base)).flatMap((r) => r.matchUpdateTypes ?? []));
            const offMain = off("main"), offStaging = off("staging");
            for (const t of all) {
              const onMain = !offMain.has(t), onStaging = !offStaging.has(t);
              if (onMain === onStaging) throw new Error(t + " would target " + (onMain ? "both bases" : "neither base"));
              if (onMain !== ["patch", "minor"].includes(t)) throw new Error(t + " on the wrong base: only patch and minor target main");
            }
            const label = rules.filter((r) => (r.addLabels ?? []).includes("fast-track"));
            if (label.length !== 1 || JSON.stringify(label[0].matchBaseBranches) !== JSON.stringify(["main"]) || JSON.stringify([...label[0].matchUpdateTypes].sort()) !== JSON.stringify(["minor", "patch"]))
              throw new Error("exactly one rule may add fast-track, bound to main and patch/minor: main-gate reads it");
            console.log("renovate-staging-flow.json OK: patch and minor to main with fast-track, everything else to staging");
          '

  # Proves the Prettier/Svelte gate on a known-bad input, which is the whole
  # point: the reusable lint step had only ever PASSED, and passed precisely
  # because it was parsing nothing. Both fixtures hold the same mis-formatted
  # .svelte file and must produce OPPOSITE outcomes.
  prettier-svelte-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Premise — ci.yml still runs Prettier bare
        run: |
          grep -qF 'pnpm exec prettier --check .' .github/workflows/ci.yml || {
            echo "::error::ci.yml no longer runs 'pnpm exec prettier --check .' — re-derive this test"
            exit 1
          }
          echo "premise holds"
      - name: Install the fleet's Prettier into both fixtures
        run: |
          for d in with-config no-config; do
            (cd "tests/prettier-svelte/$d" && npm install --no-save --silent prettier@3.8.3 prettier-plugin-svelte@4.0.1)
          done
      - name: With a config, the mangled .svelte FAILS the lint command
        working-directory: tests/prettier-svelte/with-config
        run: |
          set +e
          out=$(npx prettier --check . 2>&1); rc=$?
          set -e
          echo "$out"
          if [ "$rc" -eq 0 ]; then
            echo "::error::prettier --check passed on a deliberately mangled .svelte file — the gate does not bite"
            exit 1
          fi
          echo "$out" | grep -qF 'src/Mangled.svelte' || {
            echo "::error::prettier failed but never named src/Mangled.svelte"
            exit 1
          }
          echo "gate bites: exit $rc, names src/Mangled.svelte"
      - name: Without a config, the SAME file passes — the blind spot, pinned
        working-directory: tests/prettier-svelte/no-config
        run: |
          set +e
          out=$(npx prettier --check . 2>&1); rc=$?
          set -e
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::notice::Prettier now flags .svelte with no configured plugin (exit $rc). The #818 blind spot is gone upstream and the guard below can be retired — update this test deliberately."
            exit 1
          fi
          echo "blind spot confirmed: exit 0 on a mangled .svelte with no config"
      - name: The guard shipped in ci.yml rejects the config-less repo
        run: |
          sed -n '/# >>> prettier-svelte-guard >>>/,/# <<< prettier-svelte-guard <<</p' \
            .github/workflows/ci.yml | sed 's/^          //' > "$RUNNER_TEMP/guard.sh"
          test -s "$RUNNER_TEMP/guard.sh" || { echo "::error::guard markers not found in ci.yml"; exit 1; }
          set +e
          (cd tests/prettier-svelte/no-config && sh "$RUNNER_TEMP/guard.sh"); bad=$?
          (cd tests/prettier-svelte/with-config && sh "$RUNNER_TEMP/guard.sh"); good=$?
          set -e
          [ "$bad" -ne 0 ] || { echo "::error::guard passed a repo with .svelte files and no config"; exit 1; }
          [ "$good" -eq 0 ] || { echo "::error::guard rejected a repo that HAS a config"; exit 1; }
          echo "guard: rejects config-less ($bad), accepts configured ($good)"
