name: ci
on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version for CI (defaults to the org standard)
        type: string
        default: "22"
      netlify-site:
        description: Netlify site name for the deploy-preview URL (defaults to the repo name)
        type: string
        default: ""
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check .
      - run: pnpm exec eslint .
      - run: pnpm exec svelte-kit sync && pnpm exec svelte-check --tsconfig ./tsconfig.json
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec reddoor-maint audit --only a11y --fail-on-violations
      - name: Test (if present)
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            pnpm test
          else
            echo "no test script — skipping"
          fi

      # Smoke suite (health-gate): run the site's own `test:smoke` at PR time so a
      # broken route / hydration regression is caught before merge, complementing the
      # nightly fleet-smoke producer (reddoor-maintenance) that writes Smoke OK to
      # Airtable. chromium's OS libs are already installed above; the site's script
      # installs the browser binary. `if present` so a site without the suite skips.
      #
      # Skipped when the site's own `test` script already chains `test:smoke` — the
      # step above just ran it, and running the Playwright suite twice per PR only
      # burns minutes. Most sites chain it; gallerysonder has `test:smoke` with no
      # `test` script at all, so the step is still the only thing that runs its
      # smoke suite. Hence a condition, not a deletion.
      - name: Smoke test (if present)
        run: |
          if node -e "
            const s = require('./package.json').scripts ?? {};
            const chained = (s.test ?? '').includes('test:smoke');
            process.exit(s['test:smoke'] && !chained ? 0 : 1);
          "; then
            pnpm test:smoke
          else
            echo "no test:smoke script, or \`pnpm test\` already ran it — skipping"
          fi

  deploy-preview-comment:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Comment Netlify deploy preview link
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NETLIFY_SITE: ${{ inputs.netlify-site }}
        with:
          script: |
            const site = process.env.NETLIFY_SITE || context.repo.repo;
            const pr = context.issue.number;
            const url = `https://deploy-preview-${pr}--${site}.netlify.app`;
            const marker = "<!-- netlify-deploy-preview -->";
            const body = [
              marker,
              "### 🔍 Netlify deploy preview",
              "",
              `**[${url}](${url})**`,
              "",
              "<sub>Auto-posted · live once Netlify finishes building this PR · updates on each push.</sub>",
            ].join("\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
            });
            const prev = comments.find((c) => c.body && c.body.includes(marker));
            if (prev) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prev.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr,
                body,
              });
            }
